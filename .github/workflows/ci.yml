name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, database and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: garfo
          POSTGRES_PASSWORD: garfo
          POSTGRES_DB: garfo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garfo -d garfo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI never uses a real LLM key (SPEC section 2).
    env:
      DATABASE_URL: postgresql://garfo:garfo@localhost:5432/garfo
      LLM_PROVIDER: fake
      EMBEDDING_DIMENSIONS: '1536'
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      # LLM_PROVIDER=fake comes from the job env: no real key, no network.
      - name: Embed dishes (fake provider)
        run: pnpm db:embed

      - name: Unit and integration tests
        run: pnpm test

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
