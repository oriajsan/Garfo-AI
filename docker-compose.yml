# Garfo AI — ambiente local.
#   docker compose up -d db   -> só o banco (para rodar a API com `pnpm dev:api`)
#   docker compose up --build -> banco + API (http://localhost:3001/api/v1/health)
# O serviço "web" entra no bloco 4 do cronograma.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: garfo
      POSTGRES_PASSWORD: garfo
      POSTGRES_DB: garfo
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garfo -d garfo']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://garfo:garfo@db:5432/garfo
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MAX_DAILY_CHAT_REQUESTS: ${MAX_DAILY_CHAT_REQUESTS:-500}
      PORT: 3001
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
