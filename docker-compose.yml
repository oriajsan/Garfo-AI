# Garfo AI — ambiente local.
#   docker compose up -d db   -> só o banco (para rodar a API com `pnpm dev:api`)
#   docker compose up --build -> banco + API + web: a demo completa em http://localhost:3000
#                                (API em http://localhost:3001/api/v1/health)
# Sem OPENAI_API_KEY a API roda em modo demonstração (LLM_PROVIDER=fake) e a interface avisa.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: garfo
      POSTGRES_PASSWORD: garfo
      POSTGRES_DB: garfo
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garfo -d garfo']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://garfo:garfo@db:5432/garfo
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MAX_DAILY_CHAT_REQUESTS: ${MAX_DAILY_CHAT_REQUESTS:-500}
      PORT: 3001
      # Migrations + seed + embeddings no start do container (idempotente). Use false quando o banco
      # for preparado de fora (ex.: Neon com `pnpm db:setup`).
      DB_BOOTSTRAP_ON_START: ${DB_BOOTSTRAP_ON_START:-true}
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Embutidas no bundle: o navegador (fora do compose) é quem chama a API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  db-data:
